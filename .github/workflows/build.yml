name: Build Record + RecordAudio (Android64)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-record:
    name: Build Record (Android ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Record
        uses: actions/checkout@v4

      - name: Build Record
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          android-min-sdk: 23

      - name: Upload Record
        uses: actions/upload-artifact@v4
        with:
          name: Record
          path: output/*.geode
          if-no-files-found: error
          retention-days: 14

  build-audio:
    name: Build RecordAudio (Android ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RecordAudio
        uses: actions/checkout@v4
        with:
          repository: fakeskyline/RecordAudio

      - name: Build RecordAudio
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          android-min-sdk: 23

      - name: Upload RecordAudio
        uses: actions/upload-artifact@v4
        with:
          name: RecordAudio
          path: output/*.geode
          if-no-files-found: error
          retention-days: 14

  combine-artifacts:
    name: Combine Geode mods
    runs-on: ubuntu-latest
    needs: [build-record, build-audio]
    steps:
      - name: Download both build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload combined mods
        uses: actions/upload-artifact@v4
        with:
          name: Record-and-RecordAudio-Android64
          path: dist/*.geode
          if-no-files-found: error
          retention-days: 14
