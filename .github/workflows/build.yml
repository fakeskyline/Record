name: Build Record (Android64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android64:
    name: Build Android ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          android-min-sdk: 23

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: Record-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
