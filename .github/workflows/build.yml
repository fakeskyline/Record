name: Build Record + RecordAudio (Android64)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android64:
    name: Build both Geode mods (Android ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Record
        uses: actions/checkout@v4
      - name: Checkout RecordAudio companion
        uses: actions/checkout@v4
        with:
          repository: fakeskyline/RecordAudio
          path: RecordAudio
      - name: Build Record
        id: build-record
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          android-min-sdk: 23
      - name: Preserve Record artifact directory
        run: mv output output-record
      - name: Build RecordAudio
        id: build-audio
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          android-min-sdk: 23
          path: RecordAudio
          ccache-variant: ""
      - name: Upload both .geode artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Record-and-RecordAudio-Android64
          path: |
            output-record/*.geode
            output/*.geode
          if-no-files-found: error
          retention-days: 14
